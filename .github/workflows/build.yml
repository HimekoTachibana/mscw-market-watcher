name: Build

# Push a tag like v0.4.0 to build Windows, Linux and macOS programs and publish them as a GitHub release.
# You can also start it by hand under Actions -> Build (it then only produces downloadable Artifacts).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb alsa-utils

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller pytest

      - name: Check tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          app_version=$(python tools/version.py)
          if [ "v$app_version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION $app_version in mesowatcher/core.py"
            exit 1
          fi

      - name: Tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -q

      - name: Tests (Windows, macOS)
        if: runner.os != 'Linux'
        run: python -m pytest -q

      - name: Build with PyInstaller
        run: python -m PyInstaller --noconfirm --clean mesowatcher.spec

      - name: Package
        run: python tools/package.py

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: release/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: assets
          merge-multiple: true

      - name: Notes from CHANGELOG
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '
            $0 ~ "^## v" v " " {on=1; next}
            on && /^## v/ {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "Release ${GITHUB_REF_NAME}" > notes.md; fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l assets
          gh release create "${GITHUB_REF_NAME}" assets/* \
            --title "MSCW Market Watcher ${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            --verify-tag
